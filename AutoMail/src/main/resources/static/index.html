<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoMail Pro | Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="brand">
                <div class="logo-icon"></div>
                <h1>AutoMail</h1>
            </div>
            <nav class="nav-menu">
                <a href="#" class="nav-item active" id="nav-compose">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                    Compose Mail
                </a>
                <a href="#" class="nav-item" id="nav-history">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                    Mail History
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <h2>Mail Dashboard</h2>
                <div class="user-profile">
                    <img src="https://ui-avatars.com/api/?name=Admin&background=6366f1&color=fff" alt="Admin" class="avatar">
                </div>
            </header>

            <div class="content-area">
                <!-- Compose Section -->
                <section id="compose-section" class="active-section">
                    <div class="glass-card compose-card">
                        <h3>Send New Message</h3>
                        <form id="mail-form">
                            <div class="form-group">
                                <label for="recipient">To</label>
                                <input type="email" id="recipient" placeholder="recipient@example.com" required>
                            </div>
                            <div class="form-group">
                                <label for="subject">Subject</label>
                                <input type="text" id="subject" placeholder="Enter mail subject" required>
                            </div>
                            <div class="form-group">
                                <label for="body">Message</label>
                                <textarea id="body" rows="6" placeholder="Write your message here..." required></textarea>
                            </div>
                            <button type="submit" class="btn-primary" id="send-btn">
                                <span>Send Mail</span>
                                <div class="loader" id="send-loader" style="display: none;"></div>
                            </button>
                            <div id="status-message" class="status-message"></div>
                        </form>
                    </div>
                </section>

                <!-- History Section -->
                <section id="history-section" style="display: none;">
                    <div class="glass-card history-card">
                        <div class="history-header">
                            <h3>Sent Mails</h3>
                            <button class="btn-icon" id="refresh-btn" title="Refresh">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.92-10.44l5.58 5.58"/></svg>
                            </button>
                        </div>
                        <div class="table-responsive">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>Recipient</th>
                                        <th>Subject</th>
                                        <th>Date</th>
                                        <th>Status</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody id="history-body">
                                    <!-- Dynamic content -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Modal for viewing mail -->
    <div class="modal-overlay" id="mail-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-subject">Mail Subject</h3>
                <button class="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="mail-meta">
                    <p><strong>To:</strong> <span id="modal-to"></span></p>
                    <p><strong>Date:</strong> <span id="modal-date"></span></p>
                    <p><strong>Status:</strong> <span id="modal-status"></span></p>
                </div>
                <div class="mail-body-content" id="modal-body-text"></div>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
